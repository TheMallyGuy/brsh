name: Release

# Builds an unsigned brsh.ipa and publishes it as a GitHub release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26 # Xcode 26+ needed for the iOS 26 SDK
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Documented macOS install. Running the binary inside xtool.app/Contents/MacOS
      # directly (old approach) hung with zero output, even for --version.
      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      # Fail in 2 min, not 20, if xtool still hangs on startup.
      - name: Check xtool
        timeout-minutes: 2
        run: |
          xcodebuild -version
          xtool --help < /dev/null

      - name: Build unsigned IPA
        timeout-minutes: 20
        run: xtool dev build --configuration release --ipa < /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="brsh-$TAG.ipa"
          cp xtool/brsh.ipa "$IPA"
          # Release may already exist (made by hand on GitHub): attach the IPA instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "brsh $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
